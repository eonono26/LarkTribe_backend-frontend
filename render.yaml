databases:
  - name: duka-postgres
    databaseName: duka
    user: duka
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # Backend Web Service: Django REST Framework API (Python 3.12 + SQLite)
  # ---------------------------------------------------------------------------
  - type: web
    name: duka-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: duka-postgres
          property: connectionString
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: duka-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_REGION_NAME
        value: us-east-1
      - key: AWS_S3_ENDPOINT_URL
        value: ""
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
    # To persist SQLite and media uploads permanently across redeploys on Render:
    # Upgrade plan to 'starter' and uncomment the persistent disk below:
    # disk:
    #   name: duka-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # envVars:
    #   - key: DATA_DIR
    #     value: /var/data

  # ---------------------------------------------------------------------------
  # Meshy Background Worker
  # ---------------------------------------------------------------------------
  - type: worker
    name: duka-meshy-worker
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_meshy_queue
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: duka-backend
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: duka-postgres
          property: connectionString
      - key: MESHY_API_KEY
        fromService:
          type: web
          name: duka-backend
          envVarKey: MESHY_API_KEY
      - key: AWS_STORAGE_BUCKET_NAME
        fromService:
          type: web
          name: duka-backend
          envVarKey: AWS_STORAGE_BUCKET_NAME
      - key: AWS_ACCESS_KEY_ID
        fromService:
          type: web
          name: duka-backend
          envVarKey: AWS_ACCESS_KEY_ID
      - key: AWS_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: duka-backend
          envVarKey: AWS_SECRET_ACCESS_KEY
      - key: AWS_S3_REGION_NAME
        fromService:
          type: web
          name: duka-backend
          envVarKey: AWS_S3_REGION_NAME
      - key: AWS_S3_ENDPOINT_URL
        fromService:
          type: web
          name: duka-backend
          envVarKey: AWS_S3_ENDPOINT_URL
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: duka-backend
          envVarKey: RENDER_EXTERNAL_URL
  # ---------------------------------------------------------------------------
  # Frontend Web Service: Next.js Storefront & Admin (Node.js 20)
  # ---------------------------------------------------------------------------
  - type: web
    name: duka-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: duka-backend
          envVarKey: RENDER_EXTERNAL_URL
