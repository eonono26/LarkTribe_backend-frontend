databases:
  - name: duka-postgres
    databaseName: duka
    user: duka
    plan: free
    region: oregon
    ipAllowList: []

services:
  # ---------------------------------------------------------------------------
  # Backend Web Service: Django REST Framework API (Python 3.12 + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: duka-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --graceful-timeout 30
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: duka-postgres
          property: connectionString
      - key: PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: duka-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

  # ---------------------------------------------------------------------------
  # Frontend Web Service: Next.js Storefront & Admin (Node.js 20)
  # ---------------------------------------------------------------------------
  - type: web
    name: duka-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: duka-backend
          envVarKey: RENDER_EXTERNAL_URL
